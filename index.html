<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我让 Clawd 造了一个更聪明的自己 · RSI 纯代码动画</title>
<style>
  html,body{margin:0;height:100%;background:#0c0c0b;overflow:hidden;font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;color:#F0EEE6}
  #stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;background:#141413}
  body.render #ui,body.render #start{display:none}
  #start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(12,12,11,.55);cursor:pointer}
  #start .btn{font-size:22px;font-weight:700;padding:16px 34px;border-radius:999px;background:#D97757;color:#1b1a18;box-shadow:0 10px 40px rgba(217,119,87,.35)}
  #start .hint{font-size:15px;opacity:.7}
  #ui{position:absolute;left:0;right:0;bottom:0;padding:14px 22px 18px;background:linear-gradient(transparent,rgba(0,0,0,.7));display:flex;align-items:center;gap:14px;transition:opacity .3s}
  #ui.hide{opacity:0}
  #ui button{background:none;border:1px solid rgba(240,238,230,.25);color:#F0EEE6;border-radius:8px;padding:6px 12px;font:600 14px/1 inherit;cursor:pointer}
  #ui button:hover{border-color:#D97757;color:#F2A687}
  #bar{position:relative;flex:1;height:8px;border-radius:4px;background:rgba(240,238,230,.18);cursor:pointer}
  #fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:#D97757;width:0}
  .tick{position:absolute;top:-4px;width:2px;height:16px;background:rgba(240,238,230,.55)}
  .tick span{position:absolute;bottom:20px;left:-4px;white-space:nowrap;font-size:12px;opacity:0;transition:opacity .2s;background:rgba(0,0,0,.75);padding:3px 6px;border-radius:4px}
  .tick:hover span{opacity:1}
  #time{font:500 13px/1 "Liberation Mono",Menlo,monospace;opacity:.8;min-width:110px;text-align:right}
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
<div id="start"><div class="btn">▶ 播放 · Play</div><div class="hint">建议开启声音 · 空格 暂停 · ←/→ 快退/快进 · F 全屏 · ?lang=en for English</div></div>
<div id="ui" class="hide">
  <button id="pp">❚❚</button>
  <div id="bar"><div id="fill"></div></div>
  <div id="time">0:00 / 0:00</div>
  <button id="lang">EN</button>
  <button id="fs">⛶</button>
</div>
<script src="src/core.js"></script>
<script src="src/text.js"></script>
<script src="src/draw.js"></script>
<script src="src/clawd.js"></script>
<script src="src/timeline.js"></script>
<script src="src/audio.js"></script>
<script src="src/scenes/_common.js"></script>
<script src="src/scenes/00_open.js"></script>
<script src="src/scenes/01_act1.js"></script>
<script src="src/scenes/02_act2.js"></script>
<script src="src/scenes/03_act3.js"></script>
<script src="src/scenes/04_act4.js"></script>
<script src="src/scenes/05_act5.js"></script>
<script src="src/scenes/06_epilogue.js"></script>
<script src="src/player.js"></script>
</body>
</html>
